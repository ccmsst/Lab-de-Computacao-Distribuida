version: '3.8'

services:
  servico-coordenador:
    build: ./servico-coordenador
    container_name: coordenador
    ports:
      - "3000:3000"
    networks:
      - sctec-net

  servico-agendamento:
    build: ./servico-agendamento
    container_name: agendamento
    ports:
      - "5000:5000"
    environment:
      - COORDENADOR_URL=http://servico-coordenador:3000
    depends_on:
      - servico-coordenador
    networks:
      - sctec-net

networks:
  sctec-net:
    driver: bridge
